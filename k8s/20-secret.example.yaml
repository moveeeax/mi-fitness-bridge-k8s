# Copy to secret.yaml (gitignored), fill in, apply, then forget it:
# after the first successful login the bridge rotates the passToken and keeps
# the live one on the volume. This Secret is only the seed.
apiVersion: v1
kind: Secret
metadata:
  name: mi-fitness-credentials
  namespace: mi-fitness
type: Opaque
stringData:
  MI_FITNESS_USER_ID: "REPLACE_ME"
  MI_FITNESS_PASS_TOKEN: "REPLACE_ME"
