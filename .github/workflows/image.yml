name: image

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "k8s/**"]
  pull_request:
    paths-ignore: ["README.md", "k8s/**"]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Pull requests only build: no registry login, no push.
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mi-fitness-bridge
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          # The image bundles the AGPL upstream; without this the label is taken
          # from the repo license (MIT, wrapper code only) and overrides the Dockerfile.
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@v7
        with:
          context: .
          # The cluster is amd64 only, so no cross-build and no qemu.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      # Offline smoke test on PRs: seed fake credentials, WAL, upstream CLI, mcp-proxy CLI.
      - name: smoke test
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run --rm --read-only --tmpfs /data:uid=1000,gid=1000 --tmpfs /tmp \
            -e MI_FITNESS_USER_ID=1 -e MI_FITNESS_PASS_TOKEN=ci "$IMAGE" selftest
          docker run --rm --entrypoint mcp-proxy "$IMAGE" --version

      - name: tag summary
        run: echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
